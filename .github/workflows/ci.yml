name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-solutions:
    name: Run every day's tests against its solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Copy each day's solution/ over its starter/
        run: node scripts/apply-solutions.ts

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test
