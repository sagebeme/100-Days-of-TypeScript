<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>What's on this weekend</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>What's on this weekend</h1>
        <p class="tagline">Gigs, games and pop-ups in Nairobi, Saturday and Sunday.</p>
      </header>

      <div class="toolbar">
        <p class="status" id="status" role="status"></p>
        <label class="switch">
          <input id="free-only" type="checkbox" role="switch">
          <span class="switch-track" aria-hidden="true"></span>
          Free only
        </label>
      </div>

      <button class="button" id="retry" type="button" hidden>Try again</button>
      <ul class="events" id="list"></ul>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
