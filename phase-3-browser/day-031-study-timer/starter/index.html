<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Study timer</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="timer">
      <h1>Lo-fi study timer</h1>
      <p class="phase" id="phase">Focus</p>
      <p class="clock" id="clock">25:00</p>
      <div class="buttons">
        <button class="button button-primary" id="start" type="button">Start</button>
        <button class="button" id="reset" type="button">Reset</button>
      </div>
      <p class="sessions">Sessions done: <strong id="sessions">0</strong></p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
