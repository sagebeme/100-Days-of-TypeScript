<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rider Rush</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; display: grid; justify-items: center; gap: 0.75rem; padding: 1rem; }
      canvas { max-width: 100%; max-height: 70vh; border-radius: 0.5rem; }
      .hud { display: flex; gap: 1.5rem; font-variant-numeric: tabular-nums; margin: 0; }
      .controls { display: flex; gap: 1rem; }
      .controls button { font-size: 2rem; width: 5rem; height: 3.5rem; border-radius: 0.75rem; border: 0; touch-action: manipulation; }
      #message { font-size: 1.2rem; font-weight: 700; min-height: 1.5em; margin: 0; }
      #restart { font-size: 1.1rem; padding: 0.6rem 1.4rem; border-radius: 999px; border: 0; background: #ffd166; }
    </style>
  </head>
  <body>
    <h1>Rider Rush</h1>
    <canvas id="game" role="img" aria-label="Rider Rush game"></canvas>
    <p class="hud">
      <span>Distance: <span id="distance">0 m</span></span>
      <span>Score: <span id="score">0</span></span>
      <span>Best: <span id="best">0</span></span>
    </p>
    <p id="message" role="status"></p>
    <button id="restart" type="button" hidden>Ride again</button>
    <div class="controls">
      <button id="left" type="button" aria-label="Steer left">◀</button>
      <button id="right" type="button" aria-label="Steer right">▶</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
