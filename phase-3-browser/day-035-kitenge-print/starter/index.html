<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Kitenge print generator</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Kitenge print generator</h1>
        <p class="tagline">Every print comes from a number. Find one you love, and you can always get it back.</p>
      </header>

      <div class="toolbar card">
        <div class="field">
          <label for="palette">Palette</label>
          <select id="palette">
            <option value="sunset">Sunset</option>
            <option value="lake">Lake Victoria</option>
            <option value="savanna">Savanna</option>
          </select>
        </div>
        <p class="seed" id="seed" aria-live="polite"></p>
        <button class="button button-primary" id="new" type="button">New print</button>
      </div>

      <figure class="fabric">
        <canvas id="print" role="img" aria-label="A generated kitenge-style pattern"></canvas>
      </figure>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
