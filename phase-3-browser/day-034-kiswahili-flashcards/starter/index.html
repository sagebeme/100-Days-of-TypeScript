<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Kiswahili flashcards</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Kiswahili flashcards</h1>
        <p class="tagline">Say the English out loud, then flip the card. Words you know come back less often.</p>
      </header>

      <section class="flashcard" aria-label="Flashcard">
        <p class="side-label">Kiswahili</p>
        <p class="prompt" id="prompt" lang="sw"></p>
        <div class="answer-wrap">
          <p class="answer" id="answer" hidden></p>
        </div>
      </section>

      <div class="controls">
        <button class="button button-primary reveal" id="reveal" type="button">Show answer</button>
        <div class="grade" id="grade" hidden>
          <button class="button grade-wrong" id="wrong" type="button">Missed it</button>
          <button class="button grade-right" id="right" type="button">Got it</button>
        </div>
      </div>

      <p class="stats" id="stats"></p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
