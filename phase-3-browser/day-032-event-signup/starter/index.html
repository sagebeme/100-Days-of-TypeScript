<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rooftop listening party · sign up</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 26rem; margin: 2rem auto; padding: 0 1rem; }
      label, legend { display: block; margin-top: 1rem; font-weight: 600; }
      input:not([type="radio"]) { width: 100%; font-size: 1rem; padding: 0.5rem; box-sizing: border-box; }
      fieldset { border: 0; padding: 0; margin: 0; }
      fieldset label { display: inline; font-weight: 400; margin-right: 1rem; }
      [aria-invalid="true"] { border: 2px solid #c62828; }
      .error { color: #c62828; margin: 0.25rem 0 0; min-height: 1.2em; }
      button { margin-top: 1.5rem; font-size: 1.1rem; padding: 0.6rem 1.4rem; }
      #status { font-weight: 700; color: #2e7d32; }
    </style>
  </head>
  <body>
    <h1>Rooftop listening party</h1>
    <p>Saturday, 8 pm. Sign up for your ticket.</p>

    <form id="signup" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" autocomplete="name" aria-describedby="name-error">
      <p class="error" id="name-error" data-error-for="name"></p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
      <p class="error" id="email-error" data-error-for="email"></p>

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="0712 345 678" aria-describedby="phone-error">
      <p class="error" id="phone-error" data-error-for="phone"></p>

      <fieldset aria-describedby="ticket-error">
        <legend>Ticket</legend>
        <label><input type="radio" name="ticket" value="regular"> Regular</label>
        <label><input type="radio" name="ticket" value="vip"> VIP</label>
        <label><input type="radio" name="ticket" value="student"> Student</label>
      </fieldset>
      <p class="error" id="ticket-error" data-error-for="ticket"></p>

      <label for="guests">Guests (0 to 3)</label>
      <input id="guests" name="guests" type="number" min="0" max="3" value="0" aria-describedby="guests-error">
      <p class="error" id="guests-error" data-error-for="guests"></p>

      <button type="submit">Sign up</button>
    </form>
    <p id="status" role="status"></p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
