<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Rooftop listening party · sign up</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app">
      <header class="event">
        <p class="event-kicker">Sign-ups open</p>
        <h1>Rooftop listening party</h1>
        <ul class="event-facts">
          <li>Saturday, 8 pm</li>
          <li>Kilimani rooftop</li>
          <li>Limited to 60 people</li>
        </ul>
      </header>

      <form class="card" id="signup" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" autocomplete="name" aria-describedby="name-error">
          <p class="error" id="name-error" data-error-for="name"></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
          <p class="error" id="email-error" data-error-for="email"></p>
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="0712 345 678" aria-describedby="phone-hint phone-error">
          <p class="hint" id="phone-hint">We'll send your ticket here by SMS.</p>
          <p class="error" id="phone-error" data-error-for="phone"></p>
        </div>

        <fieldset class="field tickets" aria-describedby="ticket-error">
          <legend class="label">Ticket</legend>
          <label class="ticket">
            <input type="radio" name="ticket" value="regular">
            <span class="ticket-name">Regular</span>
            <span class="ticket-price">KES 1,000</span>
          </label>
          <label class="ticket">
            <input type="radio" name="ticket" value="vip">
            <span class="ticket-name">VIP</span>
            <span class="ticket-price">KES 2,500</span>
          </label>
          <label class="ticket">
            <input type="radio" name="ticket" value="student">
            <span class="ticket-name">Student</span>
            <span class="ticket-price">KES 500</span>
          </label>
          <p class="error" id="ticket-error" data-error-for="ticket"></p>
        </fieldset>

        <div class="field guests">
          <label for="guests">Guests</label>
          <input id="guests" name="guests" type="number" min="0" max="3" value="0" inputmode="numeric" aria-describedby="guests-hint guests-error">
          <p class="hint" id="guests-hint">Up to 3 friends on your ticket.</p>
          <p class="error" id="guests-error" data-error-for="guests"></p>
        </div>

        <button class="button button-primary submit" type="submit">Sign up</button>
      </form>

      <p class="status" id="status" role="status"></p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
