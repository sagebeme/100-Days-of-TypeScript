<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Split the bill</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Split the bill</h1>
        <p class="tagline">Type the total, how many of you there are and the tip. Everyone sees what to send.</p>
      </header>

      <form class="card" id="bill">
        <div class="field">
          <label for="total">Total</label>
          <div class="money">
            <span class="money-prefix" aria-hidden="true">KES</span>
            <input id="total" type="number" min="1" inputmode="numeric" placeholder="4800" aria-describedby="total-hint">
          </div>
          <p class="hint" id="total-hint">The full amount on the bill, before the tip.</p>
        </div>

        <div class="row">
          <div class="field">
            <label for="people">People</label>
            <input id="people" type="number" min="1" value="2" inputmode="numeric">
          </div>
          <div class="field">
            <label for="tip">Tip</label>
            <select id="tip">
              <option value="0">No tip</option>
              <option value="5">5%</option>
              <option value="10" selected>10%</option>
              <option value="15">15%</option>
            </select>
          </div>
        </div>
      </form>

      <p class="result" id="result" aria-live="polite"></p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
