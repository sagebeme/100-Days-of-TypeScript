<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Rider Rush · deliver the order, dodge the traffic</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2323262e'/%3E%3Crect x='12' y='7' width='8' height='20' rx='4' fill='%232a9d8f'/%3E%3Crect x='9' y='15' width='14' height='8' rx='2' fill='%23e9c46a'/%3E%3Ccircle cx='16' cy='10' r='4' fill='%23f8f9fa'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Rider Rush</h1>
        <p class="tagline">Deliver the order. Dodge the traffic.</p>
      </header>

      <section class="game" aria-label="Game">
        <dl class="hud">
          <div class="stat">
            <dt>Distance</dt>
            <dd id="distance">0 m</dd>
          </div>
          <div class="stat">
            <dt>Score</dt>
            <dd id="score">0</dd>
          </div>
          <div class="stat">
            <dt>Best</dt>
            <dd id="best">0</dd>
          </div>
        </dl>

        <div class="screen">
          <canvas id="game" role="img" aria-label="Rider Rush: a three-lane road with traffic coming towards your motorbike"></canvas>
        </div>

        <div class="steer" aria-label="Steering">
          <button class="button steer-button" id="left" type="button" aria-label="Steer left">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="button steer-button" id="right" type="button" aria-label="Steer right">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>

        <div class="actions">
          <!-- One main button at a time: Start / Ride again, or Pause / Resume. -->
          <button class="button button-primary" id="start" type="button">Start</button>
          <button class="button button-primary" id="pause" type="button" hidden>Pause</button>
          <button class="button" id="mute" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="sound-waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="sound-off" d="M16 9l6 6M22 9l-6 6"/></svg>
            Mute
          </button>
        </div>
      </section>

      <section class="help" aria-labelledby="help-title">
        <h2 id="help-title">Controls</h2>
        <dl class="keys">
          <div><dt><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd></dt><dd>Change lane</dd></div>
          <div><dt><kbd>Space</kbd></dt><dd>Start, or ride again</dd></div>
          <div><dt><kbd>P</kbd> or <kbd>Esc</kbd></dt><dd>Pause and resume</dd></div>
          <div><dt><kbd>M</kbd></dt><dd>Sound on and off</dd></div>
          <div><dt>Touch</dt><dd>Swipe, or tap the side of the road you want</dd></div>
        </dl>
      </section>

      <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
